name: streakwok
description: "StreakWok - Calisthenics habit tracker mobile app with on-device MediaPipe pose estimation and synced group streaks."
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Services & Google Sign-In (Official SDD Architecture)
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  google_sign_in: ^6.2.1

  # Computer Vision & Sensor Pipelines (MediaPipe via Google ML Kit)
  google_mlkit_pose_detection: ^0.10.0
  camera: ^0.10.5+9

  # State Management & Utilities
  provider: ^6.1.1
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StreakWok - Login Screen</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      background-color: #F0F4F2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Standard mobile frame */
    .mobile-frame {
      width: 390px;
      height: 844px;
      background: #FFFFFF;
      border-radius: 44px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 8px solid #FFFFFF;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      transition: all 0.2s ease;
    }

    /* Native App / Mobile Viewport / Standalone Mode (Full Screen Edge-to-Edge) */
    @media (max-width: 900px), (display-mode: standalone), (display-mode: fullscreen) {
      body {
        padding: 0 !important;
        margin: 0 !important;
        background-color: #FFFFFF !important;
        min-height: 100dvh !important;
        height: 100dvh !important;
        overflow: hidden !important;
      }

      .mobile-frame {
        width: 100vw !important;
        height: 100dvh !important;
        max-width: 100vw !important;
        max-height: 100dvh !important;
        border-radius: 0 !important;
        border: none !important;
        box-shadow: none !important;
      }

      .status-bar {
        display: none !important;
      }

      .home-indicator {
        display: none !important;
      }

      .content-area {
        padding: 24px 24px 40px !important;
        -webkit-overflow-scrolling: touch;
      }
    }

    /* Forced Native App Mode via Toggle or Browser Fullscreen */
    body.native-app-mode,
    body:fullscreen {
      padding: 0 !important;
      margin: 0 !important;
      background-color: #FFFFFF !important;
      min-height: 100vh !important;
      height: 100vh !important;
      overflow: hidden !important;
    }

    body.native-app-mode .mobile-frame,
    body:fullscreen .mobile-frame {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }

    body.native-app-mode .status-bar,
    body:fullscreen .status-bar {
      display: none !important;
    }

    body.native-app-mode .home-indicator,
    body:fullscreen .home-indicator {
      display: none !important;
    }

    /* Status Bar Mobile */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px 0;
      font-size: 14px;
      font-weight: 600;
      color: #1A1D1E;
    }

    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Main Content */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 24px 24px;
      flex: 1;
      justify-content: space-between;
    }

    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    .mascot-container {
      width: 140px;
      height: 140px;
      background: linear-gradient(135deg, #00D09E 0%, #009E74 100%);
      border-radius: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
    }

    .brand-title {
      font-size: 34px;
      font-weight: 800;
      color: #1A1D1E;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .brand-title span {
      color: #00D09E;
    }

    .brand-subtitle {
      font-size: 14px;
      color: #6C7278;
      line-height: 1.5;
      max-width: 290px;
    }

    /* Feature List (Ukuran Font & Layout Asli Dikembalikan) */
    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin: 20px 0;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #F8FAF9;
      border: 1.5px solid #EAEFEA;
      padding: 10px 14px;
      border-radius: 14px;
      text-align: left;
    }

    .feature-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #E8F9F3;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .feature-text {
      font-size: 12px;
      font-weight: 500;
      color: #33383F;
    }

    /* Bottom Section: Google Sign-in */
    .bottom-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .btn-google {
      width: 100%;
      height: 56px;
      background-color: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-google span {
      font-size: 15px;
      font-weight: 600;
      color: #1A1D1E;
    }

    /* Terms text */
    .terms-text {
      font-size: 11px;
      color: #8C949D;
      line-height: 1.4;
      padding: 0 10px;
    }

    .terms-text a {
      color: #00A87A;
      text-decoration: none;
      font-weight: 500;
    }

    /* Home Indicator */
    .home-indicator {
      width: 134px;
      height: 5px;
      background-color: #1A1D1E;
      border-radius: 10px;
      margin: 12px auto 6px;
      opacity: 0.2;
    }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <!-- Status Bar -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
          <rect y="7" width="3" height="4" rx="1" fill="#1A1D1E"/>
          <rect x="4.5" y="5" width="3" height="6" rx="1" fill="#1A1D1E"/>
          <rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#1A1D1E"/>
          <rect x="13.5" width="3" height="11" rx="1" fill="#1A1D1E"/>
        </svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="none">
          <rect x="0.5" y="0.5" width="20" height="11" rx="3.5" stroke="#1A1D1E"/>
          <rect x="2" y="2" width="14" height="8" rx="2" fill="#1A1D1E"/>
          <path d="M22 4C22.5 4.5 22.5 7.5 22 8" stroke="#1A1D1E" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content">
      <div class="hero-section">
        <!-- Logo Mascot Container -->
        <div class="mascot-container">
          <svg width="74" height="74" viewBox="0 0 24 24" fill="none">
            <path d="M12 2C9.5 5 7 8 7 11.5C7 14.5 9.2 17 12 17C14.8 17 17 14.5 17 11.5C17 8 14.5 5 12 2Z" fill="#FF7043"/>
            <path d="M12 7C10.5 9 9.5 10.5 9.5 12.5C9.5 14 10.6 15.5 12 15.5C13.4 15.5 14.5 14 14.5 12.5C14.5 10.5 13.5 9 12 7Z" fill="#FFA726"/>
            <path d="M5 21H19M7 19V23M17 19V23" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>

        <h1 class="brand-title">Streak<span>Wok</span></h1>
        <p class="brand-subtitle">
          Build consistent workout habits with your group. Don't let your streak flame die!
        </p>
      </div>

      <!-- Feature Highlights -->
      <div class="feature-list">
        <!-- Feature 1 -->
        <div class="feature-item">
          <div class="feature-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00D09E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
          <span class="feature-text">Real-Time Camera Validation</span>
        </div>

        <!-- Feature 2 -->
        <div class="feature-item">
          <div class="feature-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00D09E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <span class="feature-text">Group Workout Streak</span>
        </div>
      </div>

      <!-- Bottom Action Area -->
      <div class="bottom-section">
        <a href="dashboard_screen.html" style="text-decoration:none; width: 100%;">
          <button class="btn-google">
            <svg width="22" height="22" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.17 0 9.97 0 12s.45 3.83 1.25 5.42l4.03-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span>Continue with Google</span>
          </button>
        </a>

        <div style="text-align: center; margin-top: 10px; margin-bottom: 2px;">
          <a href="join_create_group.html" style="font-size: 12px; font-weight: 600; color: #00A87A; text-decoration: none;">Simulate New User (Join or Create Group) ›</a>
        </div>

        <p class="terms-text">
          By continuing, you agree to StreakWok's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </p>

        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

  <script>
    if (window.innerWidth <= 900 || window.location.protocol === 'file:' || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      document.body.classList.add('native-app-mode');
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
